<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<meta name="description" content="UI/UX designer portfolio and credentials.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav">
  <a href="#top" class="nav__name" id="nav-name">&nbsp;</a>
  <nav class="nav__links">
    <a href="#about">About</a>
    <a href="#credentials">Credentials</a>
    <a href="#contact">Contact</a>
  </nav>
  <span class="nav__status" id="nav-status"></span>
</header>

<main id="top">

  <section id="about" class="hero">
    <div class="hero__block" aria-hidden="true"></div>
    <div class="hero__content">
      <p class="hero__role" id="hero-role">&nbsp;</p>
      <h1 class="hero__name" id="hero-name">&nbsp;</h1>
      <p class="hero__tagline" id="hero-tagline"></p>
      <div class="hero__actions">
        <a class="cta" href="#contact">Let's work together</a>
        <a class="cta cta--ghost" href="#credentials">View credentials</a>
      </div>
    </div>
    <div class="about">
      <p class="about__bio" id="about-bio"></p>
      <ul class="skills" id="skills-list"></ul>
    </div>
  </section>

  <section id="credentials" class="credentials">
    <h2 class="section__title">Credentials</h2>
    <div class="cert-grid" id="cert-grid"></div>
  </section>

  <section id="contact" class="contact">
    <h2 class="section__title">Let's work together</h2>
    <p id="contact-text"></p>
    <ul class="contact-list" id="contact-list"></ul>
  </section>

</main>

<footer class="footer">
  <span id="footer-name"></span>
  <span id="footer-location"></span>
</footer>

<script src="script.js"></script>
</body>
</html>
